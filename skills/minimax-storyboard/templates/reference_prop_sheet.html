<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width={{WIDTH}}">
  <title>{{TITLE}}</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
      background: #f5f5f5;
      padding: 40px 0;
    }

    .container {
      width: {{WIDTH}}px;
      margin: 0 auto;
      background: #ffffff;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      padding: 32px;
    }

    .header {
      margin-bottom: 24px;
    }

    .header h1 { font-size: 24px; font-weight: 600; color: #1a1a1a; margin-bottom: 8px; }
    .header p { font-size: 14px; color: #666666; }

    .item-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
    }

    .item-card {
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      overflow: hidden;
      background: #fafafa;
    }

    .item-label {
      padding: 14px 16px;
      font-size: 18px;
      font-weight: 600;
      color: #333333;
      text-align: center;
      background: #f0f0f0;
    }

    .item-label.tone-1 { background: #ffe4e1; }
    .item-label.tone-2 { background: #e0f7fa; }
    .item-label.tone-3 { background: #f0f4c3; }
    .item-label.tone-4 { background: #fff9c4; }
    .item-label.tone-5 { background: #f3e5f5; }

    .item-image {
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .item-image img {
      display: block;
      max-width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>{{TITLE}}</h1>
      <p>{{DESC}}</p>
    </div>
    <div class="item-grid">
      {{ITEMS}}
    </div>
  </div>
</body>
</html>
